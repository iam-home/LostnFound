<!DOCTYPE html>
<html>
<head>
    <title>Lost & Found</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
    <script src="./Login.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- <button onclick="signOut()">logout</button> -->
    <div id="display" style="display: none;">

<!-- 디폴트 찾은. 찾고 싶은도 같은 페이지에서 필터로 하든 뭐 잘해보셈 -->

<!--
Found -> 찾은
Lost -> 찾고싶은
-->
        <button onclick="changeType('Found')">찾은 (디폴트)</button>
        <button onclick="changeType('Lost')">찾고싶은</button>

        <div class="search-container" style="position: relative; display: inline-block;">
            <input type="text" id="searchKeyword" placeholder="분실물을 검색해 보세요!" onkeyup="if(window.event.keyCode==13){searchPosts()}">
            <button type="button" id="clearSearchBtn" onclick="clearSearch()" style="display: none; margin-left: -25px; background: none; border: none; cursor: pointer;">X</button>

            <button onclick="searchPosts()">검색</button>
        </div>

        <div id="body"></div>

        <button onclick="location.href=`./HTML/write.html?from=${state}`">글쓰기</button>

    </div>
    <script>

        let state = 'Found';

        async function init() {
            // const isLogin = await checkLogin();
            const isLogin = await dever();

            if (isLogin) document.querySelector("#display").style.display = 'block';
            else if (!isLogin) document.querySelector("#display").style.display = 'none';
        }


        function changeType(type) {
            state = type;
            loadPosts();
        }

        async function loadPosts() {
            const { data: posts, error } = await client.from('posts').select('*').eq('type', state).order('created_at', { ascending: false });

        if (error) {
            console.error(error);
            return;
        }

        let tag = "";
        if (posts.length === 0) {
        tag = `<div>아직 등록된 글이 없습니다.</div>`;
      } else {
        posts.forEach(post => {
            tag += `
            <div class="post-card">
                <h3 onclick="location.href='./HTML/detail.html?id=${post.id}'" style="cursor: pointer;">${post.title}</h3>
            </div>
            `
        });
    }
    document.querySelector("#body").innerHTML = tag;
        }

        async function searchPosts() {
            const keyword = document.querySelector("#searchKeyword").value.trim();

            if (keyword === "") { // 1. 다 지우고 검색 누르기
              loadPosts();
              return;
            }

            try {
                const { data, error } = await client
                    .from("posts")
                    .select("*")
                    .or(`title.ilike.%${keyword}%,body.ilike.%${keyword}%`)
                    .order("created_at", { ascending: false });

                document.querySelector("#clearSearchBtn").style.display = "inline-block"; // 2. X버튼으로 검색창 비우기

                if (error) throw error;

                renderSearchResults(data);

            } catch (err) {
                console.error("검색 실패:", err.message);
            }
        } // 3. 로고 클릭으로 홈으로 가기

        function renderSearchResults(posts) {
            const listContainer = document.querySelector("#body");
            listContainer.innerHTML = "";

            if (posts.length === 0) {
                listContainer.innerHTML = "<p>검색 결과가 없습니다.</p>";
                return;
            }

            posts.forEach(post => {
                const isFoundType = post.type === "Found";
                const tagText = isFoundType ? "찾은" : "찾고싶은";
                const tagClass = isFoundType ? "Found" : "Lost";

                const postHtml = `
                    <div class="post-item" onclick="location.href='./HTML/detail.html?id=${post.id}'">
                        <span class="badge ${tagClass}">${tagText}</span>
                        <strong class="post-title">${post.title}</strong>
                        <span class="post-date">${new Date(post.created_at).toLocaleDateString()}</span>
                    </div>
                `;
                listContainer.innerHTML += postHtml;
            });
        }

        function clearSearch() {
            const searchInput = document.querySelector("#searchKeyword");
            searchInput.value = "";

            document.querySelector("#clearSearchBtn").style.display = "none";
            loadPosts();
        }

        loadPosts(); // 디폴트이심
        init();
    </script>
</body>
</html>
