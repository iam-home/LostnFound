<!DOCTYPE html>
<html>
<head>
    <title>Lost & Found</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
    <script src="./Login.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- <button onclick="signOut()">logout</button> -->
    <div id="display" style="display: none;">

<!-- 디폴트 습득. 찾고 싶은도 같은 페이지에서 필터로 하든 뭐 잘해보셈 -->

<!--
Found -> 습득
Lost -> 분실
-->
    <div>
        <div style="position: relative; width: 24px; height: 24px; display: inline-block; color: #2d7a4f;" onclick='loadPosts();'> <!--3. 로고클릭으로 홈으로 가기-->
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="width:24px; height:24px;"
            >
                <path d="M11 20A7 7 0 0 1 9.8 6.9C15.5 4.9 17 3.5 19 2c1 2 2 4.5 1 8-1 3.5-3.5 6-7 8.08"/>
                <path d="M5 19a7 7 0 0 1 3.3-12"/>
            </svg>
        
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="
                    position:absolute;
                    right:-6px;
                    bottom:-4px;
                    width:14px;
                    height:14px;
                "
            >
                <path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/>
                <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
                <path d="M12 2v2"/>
                <path d="M12 20v2"/>
                <path d="m4.93 4.93 1.41 1.41"/>
                <path d="m17.66 17.66 1.41 1.41"/>
                <path d="M2 12h2"/>
                <path d="M20 12h2"/>
                <path d="m6.34 17.66-1.41 1.41"/>
                <path d="m19.07 4.93-1.41 1.41"/>
            </svg>
        </div>
    

        <button onclick="changeType('Found')">습득</button>
        <button onclick="changeType('Lost')">분실</button>

        <div class="search-container" style="position: relative; display: inline-block;">
            <input type="text" id="searchKeyword" placeholder="검색어 입력" onkeyup="if(window.event.keyCode==13){searchPosts()}">
            <button type="button" id="clearSearchBtn" onclick="clearSearch()" style="display: none; margin-left: -25px; background: none; border: none; cursor: pointer;">X</button>

            <button onclick="searchPosts()">검색</button>
        </div>
    </div>

    
        <div id="body"></div>

        <button onclick="location.href=`./HTML/write.html?from=${state}`">글쓰기</button>
        <!--습득/분실을 말로 쓰지 말고 색으로 표현하는 게 낫지않을까-->

    </div>
    <script>

        let state = 'Found';

        async function init() {
            // const isLogin = await checkLogin();
            const isLogin = await dever();

            if (isLogin) document.querySelector("#display").style.display = 'block';
            else if (!isLogin) document.querySelector("#display").style.display = 'none';
        }


        function changeType(type) {
            state = type;
            loadPosts();
        }

        async function loadPosts() {
            const { data: posts, error } = await client
              .from('posts')
              .select('*')
              .match({
                'type': state,
                'isFound': "active"
              })
              .order('created_at', { ascending: false });

        if (error) {
            console.error(error);
            return;
        }

        let tag = "";
        if (posts.length === 0) {
        tag = `<div>아직 등록된 글이 없습니다.</div>`;
      } else {
        posts.forEach(post => {
            tag += `
            <div class="post-card">
                <h3 onclick="location.href='./HTML/detail.html?id=${post.id}'" style="cursor: pointer;">${post.title}</h3>
            </div>
            `
        });
    }
    document.querySelector("#body").innerHTML = tag;
        }

        async function searchPosts() {
            const keyword = document.querySelector("#searchKeyword").value.trim();

            if (keyword === "") { // 1. 다 지우고 검색 누르기
              loadPosts();
              return;
            }

            try {
                const { data, error } = await client
                    .from("posts")
                    .select("*")
                    .or(`title.ilike.%${keyword}%,body.ilike.%${keyword}%`)
                    .eq('isFound', "active")
                    .order("created_at", { ascending: false });

                document.querySelector("#clearSearchBtn").style.display = "inline-block"; // 2. X버튼으로 검색창 비우기

                if (error) throw error;

                renderSearchResults(data);

            } catch (err) {
                console.error("검색 실패:", err.message);
            }
        }

        function renderSearchResults(posts) {
            const listContainer = document.querySelector("#body");
            listContainer.innerHTML = "";

            if (posts.length === 0) {
                listContainer.innerHTML = "<p>검색 결과가 없습니다.</p>";
                return;
            }

            posts.forEach(post => {
                const isFoundType = post.type === "Found";
                const tagText = isFoundType ? "습득" : "분실";
                const tagClass = isFoundType ? "Found" : "Lost";

                const postHtml = `
                    <div class="post-item" onclick="location.href='./HTML/detail.html?id=${post.id}'">
                        <span class="badge ${tagClass}">${tagText}</span>
                        <strong class="post-title">${post.title}</strong>
                        <span class="post-date">${new Date(post.created_at).toLocaleDateString()}</span>
                    </div>
                `;
                listContainer.innerHTML += postHtml;
            });
        }

        function clearSearch() {
            const searchInput = document.querySelector("#searchKeyword");
            searchInput.value = "";

            document.querySelector("#clearSearchBtn").style.display = "none";
            loadPosts();
        }

        loadPosts(); // 디폴트이심
        init();
    </script>
</body>
</html>
