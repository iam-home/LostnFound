<!DOCTYPE html>
<html>
<head>
    <title>Detail | Lost & Found</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
    <script src="../Login.js"></script>
    <link rel="stylesheet" href="../style.css">
    <style>
        .menu-container {
            position: relative;
            display: inline-block;
            float: right;
        }
        .dots-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        .dropdown-menu { 
            display: none;
            position: absolute;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-menu button {
            white-space: nowrap;
            display: block; 
            width: 100%; 
            padding: 10px 20px; 
            border: none; 
            background: none; 
            cursor: pointer; 
            text-align: left;
        }
        .dropdown-menu button:hover {
            background: #f5f5f5;
        }
        .show {
            display: block;
        }
        

        #postImage {
            max-width: 100%;
            height: auto;
            margin-top: 15px;
            display: none;
        }       
    </style>
</head>
<body>

    <div style="position: relative; width: 24px; height: 24px; display: inline-block; color: #2d7a4f;" onclick='location.replace("../index.html");'> <!--로고클릭으로 홈으로 가기-->
        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="width:24px; height:24px;"
        >
            <path d="M11 20A7 7 0 0 1 9.8 6.9C15.5 4.9 17 3.5 19 2c1 2 2 4.5 1 8-1 3.5-3.5 6-7 8.08"/>
            <path d="M5 19a7 7 0 0 1 3.3-12"/>
        </svg>
    
        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="
                position:absolute;
                right:-6px;
                bottom:-4px;
                width:14px;
                height:14px;
            "
        >
            <path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/>
            <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
        </svg>
    </div>
    <button onclick="goBack();">목록으로</button>
    <!-- 여기는 뒤로 가는 게 나을까 홈으로 보내는 게 나을까 -->

    <div class="menu-container">
        <button class="dots-btn" onclick="toggleMenu()">⋮</button>
        <div id="myDropdown" class="dropdown-menu">
            <button id='finishBtn' onclick="completePost(postId)">전달 완료</button>
            <button onclick="location.href = `./edit.html?id=${postId}`;">수정하기</button>
            <button onclick="deletePost()" style="color: red;">삭제하기</button>
        </div>
    </div>

    <div id="postDetail">
        <h1 id="postTitle">로딩 중...</h1> <!--이거 좀 별로지않냐-->
        <hr>
        <p id="postBody"></p>
        <img id="postImage" src="" alt="첨부 이미지">
    </div>
    
    <!-- comments -->
    <div id="comment"></div>



    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        let currentPost = null;
        let state = 'Found';
    
        document.addEventListener("DOMContentLoaded", async () => {
            if (!postId) {
                alert("잘못된 접근입니다.");
                location.replace(`../index.html`);
                return;
            }
            await loadPostDetail();
        });
    
        async function completePost(postId) {
        
            try {
                const { data, error } = await client
                    .from("posts")
                    .update({ isFound: "completed" })
                    .select("*")
                    .eq("id", postId)
                    .single();
        
                if (error) throw error;
    
                if (data.type === 'Found') {
                  if (!confirm("분실물 전달을 마치셨나요? 전달 완료 시 목록에서 숨겨집니다.")) return;
                } else if (data.type === 'Lost') {
                  if (!confirm("이 분실물을 정말 찾으셨나요? 찾음 완료 시 목록에서 숨겨집니다.")) return;
                }
    
                if (data.type === 'Found') {
                  alert("분실물 전달 완료 처리가 되었습니다.");
                } else if (data.type === 'Lost') {
                  alert("분실물 찾음 완료 처리가 되었습니다.");
                }
    
                location.replace(`../index.html`);
                
            } catch (err) {
                console.error("상태 업데이트 실패:", err.message);
                alert("처리에 실패했습니다. 다시 시도해 주세요.");
            }
        }
    
        function goBack() {
            const referrer = document.referrer;
    
            if (referrer.includes("edit.html")) {
                location.href = "../index.html"; 
            } else {
                window.history.back();
            }
        }
    
        async function loadPostDetail() {
            try {
                const { data, error } = await client
                    .from("posts")
                    .select("*")
                    .eq("id", postId)
                    .single();
                
                // const { data } = await client
                //     .from("comments")
                //     .select("*")
                //     .eq("id", commentId) // id를 쓰는 게 맞는지 / commsntId 선언하셈
    
                if (error) throw error;
    
                if (data.type === 'Lost') document.querySelector("#finishBtn").innerHTML = '찾음 완료';
                
                currentPost = data;
                document.querySelector("#postTitle").innerText = data.title;
                document.querySelector("#postBody").innerText = data.body;
                // document.querySelector("#comment").innerText =
    
                if (data.image_url) {
                    const imgTag = document.querySelector("#postImage");
                    imgTag.src = data.image_url;
                    imgTag.style.display = "block";
                }
    
            } catch (err) {
                console.error("글 로딩 실패:", err.message);
                alert("글을 불러오지 못했습니다.");
            }
        }
    
        function toggleMenu() {
            document.querySelector("#myDropdown").classList.toggle("show");
        }
    
        window.onclick = function(event) {
            if (!event.target.matches('.dots-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
        
        async function deletePost() {
    if (!confirm("정말 이 게시글을 삭제하시겠습니까?")) {
        return;
    }
    
    try {
        const { data: postData, error: fetchError } = await client
            .from("posts")
            .select("image_url")
            .eq("id", postId)
            .single();
    
        if (fetchError) throw fetchError;
    
        if (postData && postData.image_url) {
            const fileName = postData.image_url.split('/').pop();
    
            console.log("스토리지에서 지울 파일명:", fileName);
    
            const { error: storageError } = await client
                .storage
                .from('upload')
                .remove([fileName]);
    
            if (storageError) {
                console.error("스토리지 사진 삭제 실패:", storageError.message);
            } else {
                console.log("스토리지 파일 삭제 완수");
            }
        }
    
        const { error: dbError } = await client
            .from("posts")
            .delete()
            .eq("id", postId);
    
        if (dbError) throw dbError;
    
        alert("게시글이 삭제되었습니다.");
        location.replace('../index.html')
    
    } catch (err) {
        console.error("삭제 처리 중 오류 발생:", err.message);
        alert("삭제에 실패했습니다: " + err.message);
    }
    }
    
    </script>
</body>
</html>
