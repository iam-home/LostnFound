<!DOCTYPE html>
<html>
<head>
    <title>Write |  Lost & Found</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>

    <script src="../Login.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    
    <header>
    <div>
        
      <button onclick="goBack()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span>취소</span>
      </button>

      <span id='whatIsThisState'>찾은 이거 뭐라 써야되냐</span>
      <button onclick="handleRegister();">등록 완료</button>
    
    </div>
  </header>
    
    <textarea id="title" oninput="autoResize(this)" placeholder="제목 입력"></textarea>
    <br />
    <textarea id="body" oninput="autoResize(this)" placeholder="본문 입력"></textarea>
    <br />
    <h1>위치 정보는 직접 입력보다는 선택하는게 낫겠지 // 선택 필수, 추가 설명</h1>
    <br />
    <input type="file" id="fileInput" />
    <h5>※ 사진이 있으면 분실자가 물건을 찾을 확률이 크게 높아집니다.</h5>
    <div id="preview"></div>
    
    

    
    <script>
    let fromSource = null;
    
    function autoResize(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
    }

    async function handleRegister() {
        const title = document.querySelector("#title").value.trim();
        const body = document.querySelector("#body").value.trim();
        const fileInput = document.querySelector("#fileInput");
    
        if (!title || !body) {
            alert("제목과 내용을 입력해 주세요.");
            return;
        }
        
        try {
            let uploadedImageUrl = null;
    
            if (fileInput && fileInput.files.length > 0) {
                let file = fileInput.files[0];
                const fileExtension = file.name.split('.').pop().toLowerCase();
    
                if (fileExtension === 'heic') {
                    alert("JPEG 변환을 시작합니다...");
                    
                        const convertedBlob = await heic2any({
                        blob: file,
                        toType: "image/jpeg",
                        quality: 0.8
                    });
                    
                file = new File([convertedBlob], file.name.replace(/\.heic$/i, '.jpg'), {
                    type: "image/jpeg"
                });
                    
                    console.log("JPEG 변환 완료");
                }
    
                const fileName = `${Date.now()}_${file.name}`;
                
                const { data: storageData, error: storageError } = await client
                    .storage
                    .from('upload')
                    .upload(fileName, file);
    
                if (storageError) throw new Error("사진 서버 업로드 실패: " + storageError.message);
    
                const { data: urlData } = client.storage.from('upload').getPublicUrl(fileName);
                uploadedImageUrl = urlData.publicUrl; 
            }
        
            const { error: dbError } = await client
                .from("posts")
                .insert([
                    {
                        title: title,
                        body: body,
                        type: fromSource,
                        image_url: uploadedImageUrl,
                    }
                ]);
    
            if (dbError) throw dbError;
    
            alert("게시글이 등록되었습니다.");
            location.replace("../index.html");
    
        } catch (err) {
            console.error("등록 과정 오류 발생:", err.message);
            alert("등록 실패: " + err.message);
        }
    }


    
    function goBack() {
        if ( document.querySelector("#title").value.trim() !== "" || document.querySelector("#body").value.trim() !== "") {
            if (confirm("작성 중인 내용은 저장되지 않습니다. 나가시겠습니까?")) {
                window.history.back(); // 이거 찾고싶은에서 글쓰기로 드갔을떄 뒤로 가면 찾은으로 가짐. 뭔가 해보셈
            }
        } else {
            window.history.back();
        }
    }
    
    async function init() { // 중간에 로그인 풀 수 있는 방법이 있을까. 있으면 조건문 더 써야돠는디
        // await signInWithGoogle();
        await dever();
    }
    
    document.addEventListener("DOMContentLoaded", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        fromSource = urlParams.get('from');
        
        
        if (fromSource === 'Found') {
            찾은();
        } else if (fromSource === 'Lost') {
            document.querySelector("#whatIsThisState").innerHTML = "찾고싶은으로_바꾸셈";
            찾고싶은();
        }
        else {
            console.log("fromSource는", `${fromSource}` + "임 멍청아");
        }
        
        init();
    });
    
    // 굳이 함수를 하나 더 만들 필요가 있냐 그냥 이벤트리스너에 넣어놔도 되는거아님? 왜뺸거임?
    function 찾은() {
        console.log("찾은사람이 글쓸때 필요한 요소들 쓰라고 안내하셈. ex: 위치말고 뭐가있더라");
        // 위치같은거를 디비에 항목을 하나 따로 만들까 아니면 그냥 본문에 쓰라고 안내?를 해둘까. 강제성을 주는 게 나을거같긴 한데. 아니 그 위치 선택형 그거로 하면 좀 괜찮으려나? 그건 근데 내가 만들기 귀찮을텐데. 모든 경우를 다 써야되니까. 아닌가 기타로 묶어서 직접 쓰라고 해도 되지않을까? 아니 그냥 디비에 하나 더 만들까? 아니 디비에 만들든 그냥 바디에 쓰는거든 뭐가 다른거임? 어차피 결과는 똑같이 나오는거아님?
    }
    
    function 찾고싶은() {
        console.log("분실자가 글쓸때필요한요소. ex: 어디서 잃어버렸는지. 물건 생김새. 종류 이름");
    }
    
    </script>
</body>
</html>
