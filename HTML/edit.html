<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit | Lost & Found</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
    <script src="../Login.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    
    <textarea id="title" oninput="autoResize(this)" placeholder="수정할 제목을 입력하세요"></textarea>
    <textarea id="body" oninput="autoResize(this)" placeholder="수정할 내용을 입력하세요"></textarea>
    
    <div id="imageArea">
        <img id="postImage" src="" alt="기존 이미지" style="max-width: 100%; height: auto; display: none;">
        <button type="button" id="deleteImgBtn" onclick="deleteExistingImage()" style="display: none;">사진 삭제</button>
    </div>
    
    <input type="file" id="fileInput">
    <!--onchange="previewNewImage(this)"-->
    
    <button onclick='EDIT();'>수정 완료</button>
    
    
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id');
        
        const titleInput = document.querySelector("#title");
        const bodyInput = document.querySelector("#body");
        
        let isImageDeleted = false;
        let originalImageName = null;
        
        document.addEventListener("DOMContentLoaded", async () => {
            if (!editId) {
                alert("잘못된 접근입니다.");
                location.replace(`../index.html`);
                return;
            }
            await loadOriginalPost();
        });
        
        async function loadOriginalPost() {
            try {
                const { data, error } = await client
                    .from("posts")
                    .select("title, body, image_url")
                    .eq('id', editId)
                    .single();
                
                if (error) throw error;
                
                titleInput.value = data.title;
                bodyInput.value = data.body;
                
                if (data.image_url) {
                    const imgTag = document.querySelector("#postImage");
                    const delBtn = document.querySelector("#deleteImgBtn");
                    
                    imgTag.src = data.image_url;
                    imgTag.style.display = "block";
                    delBtn.style.display = "inline-block";
                    originalImageName = data.image_url.split('/').pop();
                }
                
                autoResize(titleInput);
                autoResize(bodyInput);
            } catch (err) {
                console.error(err.message);
            }
        }
        
        function deleteExistingImage() {
            if (confirm("이 사진을 삭제하시겠습니까?")) {
                isImageDeleted = true;
                
                document.querySelector("#postImage").style.display = "none";
                document.querySelector("#deleteImgBtn").style.display = "none";
                document.querySelector("#fileInput").value = "";
            }
        }
        
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }
        
        async function EDIT() {
            const updatedTitle = titleInput.value.trim();
            const updatedBody = bodyInput.value.trim();
            const fileInput = document.querySelector("#fileInput");
        
            if (!updatedTitle || !updatedBody) {
                alert("제목과 내용을 모두 입력해 주세요.");
                return;
            }
        
            try {
                const updateData = {
                    title: updatedTitle,
                    body: updatedBody
                };
                
                
                if (fileInput && fileInput.files.length > 0) {
                    if (originalImageName) {
                        await client.storage.from('upload').remove([originalImageName]);
                    }
        
                    let file = fileInput.files[0];
                    const fileExtension = file.name.split('.').pop().toLowerCase();
                    if (fileExtension === 'heic') {
                        alert("JPEG 변환을 시작합니다...");
                        
                        const convertedBlob = await heic2any({
                            blob: file,
                            toType: "image/jpeg",
                            quality: 0.8
                        });
                        
                        file = new File([convertedBlob], file.name.replace(/\.heic$/i, '.jpg'), {
                            type: "image/jpeg"
                        });
                        
                        console.log("JPEG 변환 완료");
                    }
        
                    const fileName = `${Date.now()}.${fileExtension}`; 
        
                    const { error: storageError } = await client.storage.from('upload').upload(fileName, file);
                    if (storageError) throw new Error("새 사진 업로드 실패: " + storageError.message);
        
                    const { data: urlData } = client.storage.from('upload').getPublicUrl(fileName);
                    
                    updateData.image_url = urlData.publicUrl; 
        
                } 
                
                else if (isImageDeleted && originalImageName) {
                    const { error: removeError } = await client.storage.from('upload').remove([originalImageName]);
                    if (removeError) console.error("기존 스토리지 파일 삭제 실패:", removeError.message);
                    updateData.image_url = null; 
                }
        
        
                const { error } = await client
                    .from("posts")
                    .update(updateData)
                    .eq('id', editId);
        
                if (error) throw error;
        
                alert("수정되었습니다.");
                location.replace(`./detail.html?id=${editId}`); 
            
            } catch (err) {
                console.error("수정 실패:", err.message);
                alert("수정 실패: " + err.message);
            }
        }

        async function init() {
        const isLogin = await checkLogin();
        // const isLogin = await dever();

        if (!isLogin) {
            alert("로그인이 필요합니다.");
            location.href = "../index.html";
            return;
        }
    }

    init();

    </script>
</body>
</html>
