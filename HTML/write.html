<!DOCTYPE html>
<html>
<head>
    <title>Write | Lost & Found</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
    <script src="../Login.js"></script>
    <link rel="stylesheet" href="../style.css">

    <style>
        .menu-container {
            position: relative;
            display: inline-block;
            float: right;
        }
        .dots-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        .dropdown-menu { 
            display: none;
            position: absolute;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-menu button {
            white-space: nowrap;
            display: block; 
            width: 100%; 
            padding: 10px 20px; 
            border: none; 
            background: none; 
            cursor: pointer; 
            text-align: left;
        }
        .dropdown-menu button:hover {
            background: #f5f5f5;
        }
        .show {
            display: block;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
        }
        .form-label {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 8px;
            color: #333;
        }
        .sub-label {
            font-size: 12px;
            font-weight: normal;
            color: #666;
        }
        .dots-btn, .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
            text-align: left;
            font-size: 14px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .form-input:focus {
            outline: none;
            border-color: #007bff;
        }
        .menu-container {
            position: relative;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            width: 100%;
            z-index: 10;
            background: white;
            border: 1px solid #ddd;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        .dropdown-menu.show {
            display: block;
        }
        .dropdown-menu button {
            width: 100%;
            padding: 10px;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
        }
        .dropdown-menu button:hover {
            background-color: #f5f5f5;
        }
    </style>
    
</head>
    
    <header>
    <div>
        
      <button onclick="goBack()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span>취소</span>
      </button>

      <span id='whatIsThisState'>습득 글쓰기</span>
      <button onclick="handleRegister();">등록 완료</button>
    
    </div>
  </header>
    
    <textarea id="title" oninput="autoResize(this)" placeholder="제목 입력"></textarea>
    <br />
    <textarea id="body" oninput="autoResize(this)" placeholder="본문 입력"></textarea>
    <br />
    

    <div class="form-container">
    <!-- 1. 습득 위치 (선택) -->
    <div class="form-group">
        <label class="form-label" id="where">어디에서 습득하셨나요?</label>
        <div class="menu-container">
            <button type="button" id="locationBtn" class="dots-btn" onclick='document.querySelector("#locationDropdown").classList.toggle("show");'>
                위치를 선택해 주세요
            </button>
            <div id="locationDropdown" class="dropdown-menu">
                <button type="button" onclick="selectLocation('교실')">교실</button> <!--앞인지 안인지 / 어느 교실-->
                <button type="button" onclick="selectLocation('체육관')">체육관</button>
                <button type="button" onclick="selectLocation('도서실')">도서실</button> <!--앞인지 안인지-->
                <button type="button" onclick="selectLocation('다목적실')">다목적실</button> <!--앞인지 안인지-->
                <button type="button" onclick="selectLocation('급식실')">급식실</button>
                <button type="button" onclick="selectLocation('교무실')">교무실</button> <!--앞 / 어느 교무실인지-->
                <button type="button" onclick="selectLocation('홈베이스')">홈베이스</button> <!--어느 층 홈베이스-->
                <button type="button" onclick="selectLocation('특별실')">특별실 (음악실, 미술실, 심화학습실, 물리실, 화학실 등)</button>
                <button type="button" onclick="selectLocation('중앙 복도')">중앙 복도</button> <!--몇 층인지-->
                <button type="button" onclick="selectLocation('기타')">기타 (운동장, 신발장, 분리수거장, 화장실 등)</button>
            </div>
        </div>
    </div>
    
    <div id="subLocationContainer" class="sub-input-group">
        <select id="subPositionSelect" class="sub-select" style="display: none;">
        <option value="안쪽">실내 (안쪽)</option>
        <option value="앞(복도)">실외 (바로 앞 복도)</option>
        </select>
        <input type="text" id="subDetailInput" class="form-input" placeholder="" style="display: none;" />
    </div>

    <input type="text" id="customInputLocationocation" placeholder="어디서 잃어버리셨나요?" style="display: none; margin-top: 8px; width: 100%;" />
    <br />

    <!-- 2. 습득 날짜 (선택) -->
    <div class="form-group">
        <label class="form-label" id="when">언제 습득하셨나요?</label>
        <div class="input-container">
            <input type="date" id="dateInput" class="form-input" />
        </div>
    </div>

    <!-- 3. 물건 종류 (선택) -->
    <div class="form-group">
        <label class="form-label" id="what">어떤 물건을 습득하셨나요?</label>
        <div class="menu-container">
            <button type="button" id="categoryBtn" class="dots-btn" onclick='document.querySelector("#categoryDropdown").classList.toggle("show");'>
                물건 종류를 선택해 주세요
            </button>
            <div id="categoryDropdown" class="dropdown-menu">
                <button type="button" onclick="selectCategory('전자기기')">전자기기 (태블릿, 노트북, 이어폰, 애플펜슬 등)</button>
                <button type="button" onclick="selectCategory('필기구')">필기구 (필통, 샤프, 볼펜, 형광펜 등)</button>
                <button type="button" onclick="selectCategory('지갑')">지갑</button>
                <button type="button" onclick="selectCategory('신분증/카드')">신분증/카드 (학생증, 주민등록증, 교통카드 등)</button>
                <button type="button" onclick="selectCategory('의류')">의류 (교복, 겉옷, 우산, 모자 등)</button>
                <button type="button" onclick="selectCategory('생활용품')">생활용품 (텀블러, 안녕, 화장품 등)</button>
                <button type="button" onclick="selectCategory('기타')">기타 물품 (인형, 악세서리, 시계, 교과서, 키링 등)</button>
            </div>
        </div>
    </div>
    
    <input type="text" id="customCategoryInput" placeholder="물품 종류를 입력해주세요" style="display: none; margin-top: 8px; width: 100%;" />
    <br />


    <!-- 4. 물건 특징 (선택 || 입력) -->
    <div class="form-group">
        <label class="form-label">물건의 특징을 알려주세요. <span class="sub-label">(색상 / 스티커 / 흠집 / 키링 등)</span></label>
        <div class="input-container">
            <input type="text" id="featureBtn" class="form-input" />
        </div>
    </div>

    <!-- 5. 브랜드/제품명 (입력) -->
    <div class="form-group">
        <label class="form-label" id="WTFbrand">브랜드 또는 제품명을 입력해주세요. <span class="sub-label">(모르면 비워두셔도 됩니다.)</span></label>
        <div class="input-container">
            <input type="text" id="brandInput" class="form-input" placeholder="예: 에어팟 프로, 모나미 볼펜 등" />
        </div>
    </div>

</div>

    <br />
    <input type="file" id="fileInput" />
    <h5>※ 사진이 있으면 분실자가 물건을 찾을 확률이 크게 높아집니다.</h5>
    <div id="preview"></div>
    
    

    
    <script>
    let fromSource = null;
    let chosenLocation = "미지정";
    let chosenCategory = "미지정";
    let chosenFeature = "특징 없음";
    let finalLocation = "";
    const today = new Date().toISOString().split('T')[0];
    document.querySelector("#dateInput").max = today;


    function selectLocation(val) {
        chosenLocation = val;
        document.querySelector("#locationBtn").innerText = val;
        document.querySelector("#locationDropdown").classList.remove("show");
        
        const container = document.querySelector("#subLocationContainer");
        const positionSelect = document.querySelector("#subPositionSelect");
        const detailInput = document.querySelector("#subDetailInput");

        container.style.display = "none";
        positionSelect.style.display = "none";
        detailInput.style.display = "none";
        detailInput.value = "";

        if (!val) return;

        if (val === "교실") {
            container.style.display = "block";
            positionSelect.style.display = "block";
            detailInput.style.display = "block";
            detailInput.placeholder = "몇 학년 몇 반 교실인지 입력 (예: 3-2)";
            detailInput.focus();
        } else if (val === "도서실" || val === "다목적실") {
            container.style.display = "block";
            positionSelect.style.display = "block";
        } else if (val === "교무실") {
            container.style.display = "block";
            detailInput.style.display = "block";
            detailInput.placeholder = "어느 교무실인지 입력 (예: 2층 교무실, 3학년 교무실)";
            detailInput.focus();
        } else if (val === "홈베이스") {
            container.style.display = "block";
            detailInput.style.display = "block";
            detailInput.placeholder = "몇 층 홈베이스인지 입력 (예: 3층)";
            detailInput.focus();
        } else if (val === "특별실") {
            container.style.display = "block";
            detailInput.style.display = "block";
            detailInput.placeholder = "정확한 실명 입력 (예: 음악실, 미술실, 물리실, 화학실 등)";
            detailInput.focus();
        } else if (val === "중앙 복도") {
            container.style.display = "block";
            detailInput.style.display = "block";
            detailInput.placeholder = "몇 층 복도인지 입력 (예: 1층)";
            detailInput.focus();
        } else if (val === "기타") {
            container.style.display = "block";
            detailInput.style.display = "block";
            detailInput.placeholder = fromSource === 'Lost' ? "잃어버린 곳 입력" : "습득한 곳 입력";
            detailInput.focus();
        }
    }
    function selectCategory(val) {
        chosenCategory = val;
        document.querySelector("#categoryBtn").innerText = val;
        document.querySelector("#categoryDropdown").classList.remove("show");
    
        const customInput = document.querySelector("#customCategoryInput");
        
        if (val === "기타") {
            customInput.style.display = "block";
            customInput.focus();
        } else {
            customInput.style.display = "none";
            customInput.value = "";
        }
    }

    window.addEventListener("click", function(event) {
        if (!event.target.matches('.dots-btn')) {
            const dropdowns = document.getElementsByClassName("dropdown-menu");
            
            for (let i = 0; i < dropdowns.length; i++) {
                const openDropdown = dropdowns[i];
                
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    });
    
    function autoResize(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
    }

    async function handleRegister() {
        const title = document.querySelector("#title").value.trim();
        const body = document.querySelector("#body").value.trim();
        const fileInput = document.querySelector("#fileInput");
        const dateVal = document.querySelector("#dateInput").value || "날짜 미선택";
        const brandVal = document.querySelector("#brandInput").value.trim() || "정보 없음";
        
        const featureInputVal = document.querySelector("#featureBtn").value.trim();
        const chosenFeature = featureInputVal || "특징 없음";

        let finalCategory = chosenCategory;
        if (chosenCategory === "기타") {
            let customVal = document.querySelector("#customCategoryInput").value.trim();
            finalCategory = customVal || "기타(미입력)";
        }

        if (chosenLocation === "미지정") {
            alert(fromSource === 'Lost' ? "물건을 분실하신 위치를 선택해 주세요." : "물건을 습득하신 위치를 선택해 주세요.");
            return;
        }

        finalLocation = chosenLocation;
        const positionSelect = document.querySelector("#subPositionSelect");
        const detailInput = document.querySelector("#subDetailInput");

        if (chosenLocation === "교실") {
            const detailVal = detailInput.value.trim() || "미입력 반";
            const posVal = positionSelect.value;
            finalLocation = `교실 (${detailVal} / ${posVal})`;
        } else if (chosenLocation === "도서실" || chosenLocation === "다목적실") {
            const posVal = positionSelect.value;
            finalLocation = `${chosenLocation} (${posVal})`;
        } else if (["교무실", "홈베이스", "특별실", "중앙 복도", "기타"].includes(chosenLocation)) {
            const detailVal = detailInput.value.trim();
            finalLocation = detailVal ? `${chosenLocation} (${detailVal})` : `${chosenLocation} (상세 미입력)`;
        }

        const typeLabel = fromSource === 'Lost' ? '분실' : '습득';

        const combinedBody = `
        - ${typeLabel} 위치: ${finalLocation}
        - ${typeLabel} 일시: ${dateVal}
        - 물품 종류: ${finalCategory}
        - 물품 특징: ${chosenFeature}
        - 브랜드/제품명: ${brandVal}

        상세 내용
        ${body}
        `.trim();
    
        if (title === "") { alert("제목을 입력해주세요."); return; }
        if (body === "") { alert("내용을 입력해주세요."); return; }

        if (selectLocation === "") {
            alert("물건을 습득하신 위치를 선택해 주세요.");
            return;
        }
        
        try {
            let uploadedImageUrl = null;
    
            if (fileInput && fileInput.files.length > 0) {
                let file = fileInput.files[0];
                const fileExtension = file.name.split('.').pop().toLowerCase();
    
                if (fileExtension === 'heic') {
                    alert("JPEG 변환을 시작합니다...");
                    
                        const convertedBlob = await heic2any({
                        blob: file,
                        toType: "image/jpeg",
                        quality: 0.8
                    });
                    
                file = new File([convertedBlob], file.name.replace(/\.heic$/i, '.jpg'), {
                    type: "image/jpeg"
                });
                    
                    console.log("JPEG 변환 완료");
                }
    
                const fileName = `${Date.now()}_${file.name}`;
                
                const { data: storageData, error: storageError } = await client
                    .storage
                    .from('upload')
                    .upload(fileName, file);
    
                if (storageError) throw new Error("사진 서버 업로드 실패: " + storageError.message);
    
                const { data: urlData } = client.storage.from('upload').getPublicUrl(fileName);
                uploadedImageUrl = urlData.publicUrl; 
            }
        
            const { error: dbError } = await client
                .from("posts")
                .insert([{
                        title: title,
                        body: combinedBody,
                        isFound: "active",
                        type: fromSource,
                        image_url: uploadedImageUrl,
                    }]);
    
            if (dbError) throw dbError;
    
            localStorage.setItem('lastTab', fromSource);

            alert("게시글이 등록되었습니다.");
            location.replace("../index.html");
            // history.back();
    
        } catch (err) {
            console.error("등록 과정 오류 발생:", err.message);
            alert("등록 실패: " + err.message);
        }
    }


    
    function goBack() {
        if ( document.querySelector("#title").value.trim() !== "" || document.querySelector("#body").value.trim() !== "") {
            if (confirm("작성 중인 내용은 저장되지 않습니다. 나가시겠습니까?")) {
                // location.replace("../index.html");
                history.back();
            }
        } else {
            // location.replace("../index.html");
            history.back();
        }
    }
    
    async function init() {
        const isLogin = await checkLogin();
        // const isLogin = await dever();

        if (!isLogin) {
            location.href = "../index.html";
            return;
        }
    }
    
    document.addEventListener("DOMContentLoaded", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        fromSource = urlParams.get('from');
        
        if (fromSource) {
            localStorage.setItem('lastTab', fromSource);
        }
        
        if (fromSource === 'Lost') {
            document.querySelector("#whatIsThisState").innerHTML = '분실 글쓰기';
            document.querySelector("#where").innerHTML = '어디에서 분실하셨나요?';
            document.querySelector("#when").innerHTML = '언제 분실하셨나요?';
            document.querySelector("#what").innerHTML = '어떤 물건을 분실하셨나요?';
        }
        else {
            console.log("fromSource는", `${fromSource}` + "임 멍청아");
        }
        
        init();
    });

    </script>
</body>
</html>
