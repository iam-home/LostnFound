<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit | Lost & Found</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
    <script src="../Login.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    
    <textarea id="title" oninput="autoResize(this)" placeholder="수정할 제목을 입력하세요"></textarea>
    <textarea id="body" oninput="autoResize(this)" placeholder="수정할 내용을 입력하세요"></textarea>
    <input type="file" id="fileInput">
    <button onclick='EDIT();'>수정 완료</button>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id');
        
        const titleInput = document.querySelector("#title");
        const bodyInput = document.querySelector("#body");
        
        document.addEventListener("DOMContentLoaded", async () => {
            if (!editId) {
                alert("잘못된 접근입니다.");
                location.replace(`../index.html`);
                return;
            }
            await loadOriginalPost();
        });
        
        async function loadOriginalPost() {
            try {
                const { data: { user } } = await client.auth.getUser();
                const { data, error } = await client
                .from("posts")
                .select("title, body, user_id")
                .eq('id', editId)
                .single();
                
            if (error) throw error;

            if (data.user_id !== user.id) {
                    alert("본인이 작성한 글만 수정할 수 있습니다.");
                    console.log("멍청아");
                    window.history.back();
                    return;
                }
            
            titleInput.value = data.title;
            bodyInput.value = data.body;
            
            autoResize(titleInput);
            autoResize(bodyInput);
            } catch (err) {
                console.error("글 로딩 실패:", err.message);
                alert("글 데이터를 불러오지 못했습니다.");
            }
        }
        
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }
        
        async function EDIT() { // 있던 사진 없애는 거도 하셈. 뒤로 가는 것들 제대로들 됐는지 확인하셈
    const updatedTitle = titleInput.value.trim();
    const updatedBody = bodyInput.value.trim();
    const fileInput = document.querySelector("#fileInput");

    if (!updatedTitle || !updatedBody) {
        alert("제목과 내용을 모두 입력해 주세요.");
        return;
    }

    try {
        const updateData = {
            title: updatedTitle,
            body: updatedBody
        };

        if (fileInput && fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const fileExtension = file.name.split('.').pop(); 
            const fileName = `${Date.now()}.${fileExtension}`;

            const { data: storageData, error: storageError } = await client
                .storage
                .from('upload')
                .upload(fileName, file);

            if (storageError) throw new Error("사진 업로드 실패: " + storageError.message);

            const { data: urlData } = client
                .storage
                .from('upload')
                .getPublicUrl(fileName);

            updateData.image_url = urlData.publicUrl; 
        }

        const { error } = await client
            .from("posts")
            .update(updateData)
            .eq('id', editId);

        if (error) throw error;

        alert("수정되었습니다!");
        location.replace(`./detail.html?id=${editId}`);
    
    } catch (err) {
        console.error("수정 실패:", err.message);
        alert("수정 실패: " + err.message);
    }
}
    </script>
</body>
</html>
