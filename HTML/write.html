<!DOCTYPE html>
<html>
<head>
    <title>Write | Lost & Found</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .menu-container {
            position: relative;
            display: inline-block;
            float: right;
        }
        .dots-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        .dropdown-menu { 
            display: none;
            position: absolute;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-menu button {
            white-space: nowrap;
            display: block; 
            width: 100%; 
            padding: 10px 20px; 
            border: none; 
            background: none;

        }
        .dropdown-menu button:hover {
            background: #f5f5f5;
        }
        .show {
            display: block;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
        }
        .form-label {
            font-weight: bold;

            margin-bottom: 8px;
            color: #333;
        }
        .sub-label {
            font-size: 12px;
            font-weight: normal;
            color: #666;
        }
        .dots-btn, .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
            text-align: left;
            font-size: 14px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .form-input:focus {
            outline: none;
            border-color: #007bff;
        }
        .menu-container {
            position: relative;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            width: 100%;
            z-index: 10;
            background: white;
            border: 1px solid #ddd;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        .dropdown-menu.show {
            display: block;
        }
        .dropdown-menu button {
            width: 100%;
            padding: 10px;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
        }
        .dropdown-menu button:hover {
            background-color: #f5f5f5;
        }

</head>
    
    <header>
    <div>
        
      <button onclick="goBack()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span>취소</span>
      </button>

      <span id='whatIsThisState'>습득 글쓰기</span>
      <button onclick="handleRegister();">등록 완료</button>
    
    </div>
  </header>
    
    <textarea id="title" oninput="autoResize(this)" placeholder="제목 입력"></textarea>
    <br />
    <textarea id="body" oninput="autoResize(this)" placeholder="본문 입력"></textarea>
    <br />

    <!-- 박스 밖을 누르면 박스가 닫히는 거도 하셈 -->
    <div id="forFounder" class="form-container">
    
    <!-- 1. 습득 위치 (선택) -->
    <div class="form-group">
        <label class="form-label">어디에서 습득하셨나요?</label>
        <div class="menu-container">
            <button type="button" id="locationBtn" class="dots-btn" onclick='document.querySelector("#locationDropdown").classList.toggle("show");'>
                위치를 선택해 주세요
            </button>
            <div id="locationDropdown" class="dropdown-menu">
                <button type="button" onclick="selectLocation('여기도 입력')">여기 입력</button>
            </div>
        </div>
    </div>

    <!-- 2. 습득 날짜 (선택) -->
    <div class="form-group">
        <label class="form-label">언제 습득하셨나요?</label>
        <div class="input-container">
            <input type="date" id="dateInput" class="form-input" />
        </div>
    </div>

    <!-- 3. 물건 종류 (선택) -->
    <div class="form-group">
        <label class="form-label">어떤 물건을 습득하셨나요?</label>
        <div class="menu-container">
            <button type="button" id="categoryBtn" class="dots-btn" onclick='document.querySelector("#categoryDropdown").classList.toggle("show");'>
                물건 종류를 선택해 주세요
            </button>
            <div id="categoryDropdown" class="dropdown-menu">
                <button type="button" onclick="selectCategory('전자기기')">전자기기 (이어폰, 폰 등)</button>
                <button type="button" onclick="selectCategory('지갑/카드')">지갑 / 카드</button>
                <button type="button" onclick="selectCategory('도서/학용품')">도서 / 학용품</button>
                <button type="button" onclick="selectCategory('기타')">기타 물품</button>
            </div>
        </div>
    </div>

    <!-- 4. 물건 특징 (선택 || 입력) -->
    <div class="form-group">
        <label class="form-label">물건의 특징을 알려주세요. <span class="sub-label">(색상 / 스티커 / 흠집 / 키링 등)</span></label>
        <div class="menu-container">
            <button type="button" id="featureBtn" class="dots-btn" onclick='document.querySelector("#featureDropdown").classList.toggle("show");'>
                주요 색상/특징 선택
            </button>
            <div id="featureDropdown" class="dropdown-menu">
                <button type="button" onclick="selectFeature('흰색 계열')">흰색 계열</button>
                <button type="button" onclick="selectFeature('검은색 계열')">검은색 계열</button>
                <button type="button" onclick="selectFeature('특이한 케이스/스티커 있음')">케이스/스티커 있음</button>
            </div>
        </div>
    </div>

    <!-- 5. 브랜드/제품명 (입력) -->
    <div class="form-group">
        <label class="form-label">브랜드 또는 제품명을 입력해주세요. <span class="sub-label">(모르면 비워두기)</span></label>
        <div class="input-container">
            <input type="text" id="brandInput" class="form-input" placeholder="예: 에어팟 프로, 모나미 볼펜 등" />
        </div>
    </div>

</div>
<!--------------------------------------------->
    <div id="forLoster" style="display: none;"> <br />
        어디에서 분실하셨나요?
        <br />
        
        언제 분실하셨나요? (대략적인 날짜와 시간도 괜찬습니다.)
        <br />
        
        어떤 물건을 분실하셨나요?
        <br />
        
        물건의 특징을 알려주세요. ( 색상 / 스티커 / 흠집 / 키링 등 구별할 수 있는 특징 )
        <br />
        
        브랜드 또는 제품명을 입력해주세요. (모르면 비워두셔도 됩니다.)
        <br />
    </div>
    
    <br />
    <input type="file" id="fileInput" />
    <h5>※ 사진이 있으면 분실자가 물건을 찾을 확률이 크게 높아집니다.</h5>
    <div id="preview"></div>
    
    

    
    <script>
    let fromSource = null;
    let chosenLocation = "미지정";
    let chosenCategory = "기타";
    let chosenFeature = "특징 없음";

    function selectLocation(val) {
        chosenLocation = val;
        document.querySelector("#locationBtn").innerText = val;
        document.querySelector("#locationDropdown").classList.remove("show");
    }
    function selectCategory(val) {
        chosenCategory = val;
        document.querySelector("#categoryBtn").innerText = val;
        document.querySelector("#categoryDropdown").classList.remove("show");
    }
    function selectFeature(val) {
        chosenFeature = val;
        document.querySelector("#featureBtn").innerText = val;
        document.querySelector("#featureDropdown").classList.remove("show");
    }


    
    function autoResize(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
    }

    async function handleRegister() {
        const title = document.querySelector("#title").value.trim();
        const body = document.querySelector("#body").value.trim();
        const fileInput = document.querySelector("#fileInput");
        const dateVal = document.querySelector("#dateInput").value || "날짜 미선택";
        const brandVal = document.querySelector("#brandInput").value.trim() || "정보 없음";
        const generatedTitle = `[${chosenCategory}] ${chosenLocation}`;

        const combinedBody = `
        - 습득 위치: ${chosenLocation}
        - 습득 일시: ${dateVal}
        - 물품 종류: ${chosenCategory}
        - 물품 특징: ${chosenFeature}
        - 브랜드/제품명: ${brandVal}

        상세 내용
        ${body}
        `.trim();
    
        if (title === "") { alert("제목을 입력해주세요."); return; }
        if (body === "") { alert("내용을 입력해주세요."); return; }

        if (selectLocation === "") {
            alert("물건을 습득하신 위치를 선택해 주세요!");
            return;
        }
        
        try {
            let uploadedImageUrl = null;
    
            if (fileInput && fileInput.files.length > 0) {
                let file = fileInput.files[0];
                const fileExtension = file.name.split('.').pop().toLowerCase();
    
                if (fileExtension === 'heic') {
                    alert("JPEG 변환을 시작합니다...");
                    
                        const convertedBlob = await heic2any({
                        blob: file,
                        toType: "image/jpeg",
                        quality: 0.8
                    });
                    
                file = new File([convertedBlob], file.name.replace(/\.heic$/i, '.jpg'), {
                    type: "image/jpeg"
                });
                    
                    console.log("JPEG 변환 완료");
                }
    
                const fileName = `${Date.now()}_${file.name}`;
                
                const { data: storageData, error: storageError } = await client
                    .storage
                    .from('upload')
                    .upload(fileName, file);
    
                if (storageError) throw new Error("사진 서버 업로드 실패: " + storageError.message);
    
                const { data: urlData } = client.storage.from('upload').getPublicUrl(fileName);
                uploadedImageUrl = urlData.publicUrl; 
            }
        
            const { error: dbError } = await client
                .from("posts")
                .insert([{
                        title: title,
                        body: combinedBody,
                        isFound: "active",
                        type: fromSource,
                        image_url: uploadedImageUrl,
                    }]);
    
            if (dbError) throw dbError;
    
            alert("게시글이 등록되었습니다.");
            location.replace("../index.html");
    
        } catch (err) {
            console.error("등록 과정 오류 발생:", err.message);
            alert("등록 실패: " + err.message);
        }
    }


    
    function goBack() {
        if ( document.querySelector("#title").value.trim() !== "" || document.querySelector("#body").value.trim() !== "") {
            if (confirm("작성 중인 내용은 저장되지 않습니다. 나가시겠습니까?")) {
                window.history.back(); // 이거 분실에서 글쓰기로 드갔을떄 뒤로 가면 습득으로 가짐. 뭔가 해보셈
            }
        } else {
            window.history.back();
        }
    }
    
    async function init() { // 중간에 로그인 풀 수 있는 방법이 있을까. 있으면 조건문 더 써야돠는디
        // await signInWithGoogle();
        await dever();
    }
    
    document.addEventListener("DOMContentLoaded", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        fromSource = urlParams.get('from');
        
        
        if (fromSource === 'Found') {
            습득();
        } else if (fromSource === 'Lost') {
            document.querySelector("#forLoster").style.display = 'block';
            document.querySelector("#forFounder").style.display = 'none';
            document.querySelector("#whatIsThisState").innerHTML = "분실 글쓰기";
            // 분실();
        }
        else {
            console.log("fromSource는", `${fromSource}` + "임 멍청아");
        }
        
        init();
    });
    
    function 습득() {
        console.log("굳이 함수를 하나 더 만들 필요가 있나 싶음.");
    }
    
    function 분실() {
        console.log("hello world");
    }
    
    </script>
</body>
</html>
