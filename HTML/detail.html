<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>상세보기</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
    <script src="../Login.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <button onclick="window.history.back()">⬅️ 목록으로</button>

    <div class="menu-container">
        <button class="dots-btn" onclick="toggleMenu()">⋮</button>
        <div id="myDropdown" class="dropdown-menu">
            <button onclick="goToEdit()">수정하기</button>
            <!--수정 삭제 잘되는지 확인하셈-->
            <button onclick="deletePost()" style="color: red;">삭제하기</button>
        </div>
    </div>

    <div id="postDetail">
        <h1 id="postTitle">로딩 중...</h1>
        <hr>
        <p id="postBody"></p>
        <img id="postImage" src="" alt="첨부 이미지">
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        let currentPost = null;

        document.addEventListener("DOMContentLoaded", async () => {
            if (!postId) {
                alert("잘못된 접근입니다.");
                window.history.back();
                return;
            }
            await loadPostDetail();
        });

        async function loadPostDetail() {
            try {
                const { data, error } = await client
                    .from("posts")
                    .select("*")
                    .eq("id", postId)
                    .single();

                if (error) throw error;
                
                currentPost = data;

                document.querySelector("#postTitle").innerText = data.title;
                document.querySelector("#postBody").innerText = data.body;

                if (data.image_url) {
                    const imgTag = document.querySelector("#postImage");
                    imgTag.src = data.image_url;
                    imgTag.style.display = "block"; // 숨겨놨던 이미지 보이게 하기
                }

            } catch (err) {
                console.error("글 로딩 실패:", err.message);
                alert("글을 불러오지 못했습니다.");
            }
        }

        function toggleMenu() {
            document.querySelector("#myDropdown").classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dots-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        async function deletePost() {
            if (!confirm("정말로 이 게시글을 삭제하시겠습니까?")) return;

            try {
                if (currentPost && currentPost.image_url) {
                    const fileName = currentPost.image_url.split('/').pop(); // 여기가 사진 보여주는부분임? 사진 안보임.
                    await client.storage.from('upload').remove([fileName]);
                }

                const { error } = await client
                    .from("posts")
                    .delete()
                    .eq("id", postId);

                if (error) throw error;

                alert("삭제되었습니다.");
                location.href = "./index.html";

            } catch (err) {
                console.error("삭제 실패:", err.message);
                alert("삭제에 실패했습니다: " + err.message);
            }
        }

        function goToEdit() {
            location.href = `./edit.html?id=${postId}`; // edit 페이지 아직 안 만들었음.
        }
    </script>
</body>
</html>
